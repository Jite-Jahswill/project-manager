name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # CI-only throwaway credentials for ephemeral, loopback-only containers that exist for
      # one job. NEVER reuse any of these values elsewhere: production config refuses
      # "ci-only"/"ci-" secrets and passwords (src/config/env.ts productionBlockers).
      PGHOST: 127.0.0.1
      PGPORT: "5434"
      PGPASSWORD: ci-superuser
      POSTGRES_USER: postgres
      VENTIDOC_MIGRATOR_PASSWORD: ci-migrator
      VENTIDOC_APP_PASSWORD: ci-app
      VENTIDOC_AUTH_PASSWORD: ci-auth
      NODE_ENV: test
      APP_PUBLIC_URL: http://localhost:3001
      JWT_ACCESS_SECRET: ci-only-jwt-secret-that-is-at-least-32-bytes-long
      ABUSE_PROTECTION_SECRET: ci-only-abuse-protection-secret-at-least-32-bytes
      # Disposable CI key (32 bytes, base64). Never reuse.
      MFA_ENCRYPTION_KEYS: ci:Y2ktb25seS1tZmEta2V5LW5ldmVyLXJldXNlLTMyYnk=
      MFA_ENCRYPTION_ACTIVE_KEY_ID: ci
      # Disposable CI email key (32 bytes). Never reuse.
      EMAIL_SECRET_KEYS: ci:Y2ktb25seS1lbWFpbC1rZXktbmV2ZXItcmV1c2UtMzI=
      EMAIL_SECRET_ACTIVE_KEY_ID: ci
      # Redis is started by a step below (service containers cannot pass --requirepass).
      REDIS_URL: redis://:ci-redis@127.0.0.1:6380
      TEST_REDIS_URL: redis://:ci-redis@127.0.0.1:6380/1
      DATABASE_URL: postgresql://ventidoc_app:ci-app@127.0.0.1:5434/ventidoc_test
      AUTH_DATABASE_URL: postgresql://ventidoc_auth:ci-auth@127.0.0.1:5434/ventidoc_test
      MIGRATION_DATABASE_URL: postgresql://ventidoc_migrator:ci-migrator@127.0.0.1:5434/ventidoc_test
      TEST_DATABASE_URL: postgresql://ventidoc_app:ci-app@127.0.0.1:5434/ventidoc_test
      TEST_MIGRATION_DATABASE_URL: postgresql://ventidoc_migrator:ci-migrator@127.0.0.1:5434/ventidoc_test
      TEST_AUTH_DATABASE_URL: postgresql://ventidoc_auth:ci-auth@127.0.0.1:5434/ventidoc_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create database roles
        run: sh docker/postgres/init/01-roles.sh
      - name: Start Redis (authenticated, loopback only)
        run: |
          docker run -d --name redis -p 127.0.0.1:6380:6379 redis:7-alpine redis-server --requirepass ci-redis
          for i in $(seq 1 30); do docker exec redis redis-cli -a ci-redis --no-auth-warning ping | grep -q PONG && break; sleep 1; done
          docker exec redis redis-cli -a ci-redis --no-auth-warning ping
      - run: pnpm api typecheck
      - run: pnpm api lint
      - run: pnpm api build
      - run: pnpm api test
      - run: pnpm api test:e2e
      - name: Migration guard (protected objects + schema drift)
        run: pnpm api db:check-migrations
      - name: RBAC matrix is up to date
        run: pnpm api docs:rbac && git diff --exit-code docs/architecture/rbac-matrix.md
      - run: pnpm audit --prod --audit-level high
