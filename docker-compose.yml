# Local development infrastructure only. Not a production deployment.
name: ventidoc
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      VENTIDOC_MIGRATOR_PASSWORD: ${VENTIDOC_MIGRATOR_PASSWORD:?set in .env}
      VENTIDOC_APP_PASSWORD: ${VENTIDOC_APP_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
  # S3-compatible private object storage for attachments (development and tests; production uses
  # the provider's private, encrypted bucket: docs/security/attachments.md). One identity, from .env.
  objectstore:
    image: chrislusf/seaweedfs:3.97@sha256:bb05d66d2963b1cc48073190781c3dd29e2c4c88a2ae2986bf58e38c86d89c6e
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"ventidoc","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read","Write","List","Tagging","Admin"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=64 -volume.max=100 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set in .env}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 2s
      timeout: 3s
      retries: 60
  # Malware scanning: clamd (INSTREAM over TCP). Loads ~1 GB of signatures (about 2 minutes at
  # first start) and updates them daily with freshclam.
  clamav:
    image: clamav/clamav-debian:1.4@sha256:03a2f641117f0a8c908bac65a63c5e1e4695badc52a340c9d30397d7cebb9154
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamdb:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 300s
volumes:
  pgdata:
  objectdata:
  clamdb:
